[project]
name = "translation-turbo-backend"
version = "0.1.0"
description = "Professional Mass YouTube Video Translation Firm Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.1",
    "psycopg2-binary>=2.9.9",
    "pydantic-settings>=2.1.0",
    "celery>=5.3.6",
    "redis>=5.0.1",
    "yt-dlp>=2023.12.30",
    "python-multipart>=0.0.7",
    "loguru>=0.7.2",
    "faster-whisper>=1.0.3",
    "openai>=1.12.0",
    "edge-tts>=6.1.10",
    "flower>=2.0.1",
    "httpx>=0.26.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "black>=24.1.1",
]
